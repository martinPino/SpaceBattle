<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Space Asset Kit — Vertical Slice</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  three-d-stage:not(:defined){visibility:hidden}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070c;color:#dfe6ef;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  a{color:#4fd6ff}a:hover{color:#8ce8ff}
  #app{display:grid;grid-template-columns:322px 1fr;height:100%}
  aside{background:#080b12;border-right:1px solid #171d28;display:flex;flex-direction:column;min-height:0}
  header{padding:20px 20px 14px;border-bottom:1px solid #171d28}
  h1{margin:0;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
  .sub{margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.5;color:#6d7a8c;letter-spacing:.03em}
  .scroll{overflow-y:auto;flex:1;min-height:0;padding:14px 14px 22px}
  .grp{margin:0 0 18px}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#5b687a;padding:0 6px 8px}
  .list{display:flex;flex-direction:column;gap:3px}
  button.item{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:transparent;border:1px solid transparent;color:#b7c2d0;padding:8px 10px;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.02em;transition:background .12s,color .12s}
  button.item:hover{background:#0f151f;color:#e8eef6}
  button.item[aria-pressed="true"]{background:#0e1a24;border-color:#1d4d5e;color:#7fe7ff}
  button.item .m{font-size:9.5px;color:#5f6d80}
  button.item[aria-pressed="true"] .m{color:#4b7f92}
  .row{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px}
  .chip{background:#0d121b;border:1px solid #1b2431;color:#9fb0c2;font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 9px;border-radius:4px;cursor:pointer}
  .chip:hover{border-color:#2b6f85;color:#cfe9f5}
  .chip[aria-pressed="true"]{background:#12222c;border-color:#2f7d95;color:#7fe7ff}
  footer{border-top:1px solid #171d28;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#5f6d80;line-height:1.7}
  footer b{color:#9fb0c2;font-weight:500}
  main{position:relative;min-width:0}
  three-d-stage{width:100%;height:100%;display:block}
  .hint{position:absolute;left:18px;bottom:16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#4d5a6b;letter-spacing:.04em;pointer-events:none}
  .badge{position:absolute;right:18px;top:16px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#5c6b7d;text-align:right;line-height:1.7;pointer-events:none}
  .badge b{color:#7fe7ff;font-weight:500}
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Space Asset Kit</h1>
      <p class="sub">VERTICAL SLICE · 1 unidad = 1 m<br>Dirección artística compartida: sci-fi cinemática, metal oscuro + emissive cyan.<br><span style="color:#4b7f92">Pipeline Blender: Tools/Blender/ (mismas seeds)</span></p>
    </header>
    <div class="scroll">
      <div class="grp">
        <div class="lbl">Assets generados</div>
        <div class="list" id="catalog"></div>
      </div>
      <div class="grp">
        <div class="lbl">Vistas</div>
        <div class="row" id="views"></div>
      </div>
      <div class="grp">
        <div class="lbl">Iluminación</div>
        <div class="row" id="lights"></div>
      </div>
      <div class="grp">
        <div class="lbl">Fondo</div>
        <div class="row" id="bg"></div>
      </div>
    </div>
    <footer id="stats"></footer>
  </aside>
  <main>
    <three-d-stage name="Player_Fighter" background="#05070c"></three-d-stage>
    <div class="badge" id="badge"></div>
    <div class="hint">arrastrar = orbitar · rueda = zoom · clic derecho = desplazar</div>
  </main>
</div>

<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { CATALOG } from './space-kit-models.js';
import { makeSpaceEnvironment } from './space-kit-textures.js';

const stage = document.querySelector('three-d-stage');
await stage.ready;
const api = stage.three;

/* filmic response + a real space environment: metals now have something
   to reflect, which is what sells the PBR materials */
api.renderer.toneMapping = THREE.ACESFilmicToneMapping;
api.renderer.toneMappingExposure = 1.3;
const envRig = makeSpaceEnvironment(api.renderer);
api.scene.environment = envRig.env;

/* space lighting rig: one hard sun + cool bounce, cinematic contrast */
const rig = new THREE.Group();
const sun = new THREE.DirectionalLight(0xfff8f0, 4.4);
sun.position.set(6, 4, 7);
const bounce = new THREE.DirectionalLight(0x3f6f9a, 1.1);
bounce.position.set(-6, -2, -5);
const rim = new THREE.DirectionalLight(0x9fd0e8, 0.8);
rim.position.set(-3, 2, -8);
rig.add(sun, bounce, rim);

const studio = api.scene.children.filter(o => o.isLight);
function setLighting(mode) {
  const space = mode === 'space';
  studio.forEach(l => { l.visible = !space; });
  if (space) api.scene.add(rig); else api.scene.remove(rig);
  api.ground.visible = !space;
  api.scene.environmentIntensity = space ? 1.0 : 0.5;
}

function setBackground(mode) {
  api.scene.background = mode === 'sky' ? envRig.background : null;
}

const VIEWS = [
  ['Órbita', [1, 0.55, 1.25], 1],
  ['Frontal', [0, 0.12, 1], 1],
  ['Trasera', [0, 0.14, -1], 0.95],
  ['Perfil', [1, 0.05, 0], 1],
  ['Superior', [0, 1, 0.001], 1],
  ['Third-person', [0, 0.34, -1], 0.62],
  ['Cercana', [0.9, 0.35, 0.9], 0.38],
];

const catalogEl = document.getElementById('catalog');
const viewsEl = document.getElementById('views');
const lightsEl = document.getElementById('lights');
const statsEl = document.getElementById('stats');
const badgeEl = document.getElementById('badge');

let current = null;
const cache = new Map();

function stats(obj) {
  let tris = 0, meshes = 0, pts = 0;
  const mats = new Set(), empties = [];
  obj.traverse(o => {
    if (o.isMesh) {
      meshes++;
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      mats.add(o.material.name || o.material.uuid);
    } else if (o.isPoints) pts += o.geometry.attributes.position.count;
    else if (o.type === 'Object3D' && o.name && o !== obj) empties.push(o.name);
  });
  return { tris: Math.round(tris), meshes, mats: mats.size, pts, empties };
}

function select(entry, btn) {
  [...catalogEl.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
  if (!cache.has(entry.id)) cache.set(entry.id, entry.build());
  const obj = cache.get(entry.id);
  current = obj;
  stage.setAttribute('name', entry.label);
  stage.setObject(obj);
  const s = stats(obj);
  const box = new THREE.Box3().setFromObject(obj);
  const d = box.getSize(new THREE.Vector3());
  statsEl.innerHTML =
    `<b>${s.tris.toLocaleString('es')}</b> triángulos · <b>${s.meshes}</b> meshes<br>` +
    `<b>${s.mats}</b> materiales${s.pts ? ` · <b>${s.pts.toLocaleString('es')}</b> puntos` : ''}<br>` +
    `bbox <b>${d.x.toFixed(1)} × ${d.y.toFixed(1)} × ${d.z.toFixed(1)}</b> m` +
    (s.empties.length ? `<br>empties: ${s.empties.slice(0, 4).join(', ')}${s.empties.length > 4 ? ` +${s.empties.length - 4}` : ''}` : '');
  badgeEl.innerHTML = `<b>${entry.label}</b><br>${entry.meta}`;
  if (entry.id === 'demo') {
    // cinematic framing: sit behind the fighter, everything else falls away
    api.camera.near = 0.5; api.camera.far = 20000;
    api.camera.position.set(-26, 14, 92);
    api.camera.updateProjectionMatrix();
    api.controls.target.set(-6, 6, 20);
    api.controls.update();
    api.renderer.render(api.scene, api.camera);
    [...viewsEl.children].forEach(b => b.setAttribute('aria-pressed', 'false'));
  } else {
    setView(0);
  }
}

function setView(i) {
  [...viewsEl.children].forEach((b, j) => b.setAttribute('aria-pressed', i === j));
  const [, dir, mul] = VIEWS[i];
  stage.frameFrom(dir, mul);
}

CATALOG.forEach(entry => {
  const b = document.createElement('button');
  b.className = 'item';
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<span>${entry.label}</span><span class="m">${entry.meta}</span>`;
  b.onclick = () => select(entry, b);
  catalogEl.appendChild(b);
});

VIEWS.forEach(([label], i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = label;
  b.onclick = () => setView(i);
  viewsEl.appendChild(b);
});

[['Espacio', 'space'], ['Estudio', 'studio']].forEach(([label, mode], i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = label;
  b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => {
    [...lightsEl.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    setLighting(mode);
  };
  lightsEl.appendChild(b);
});

const bgEl = document.getElementById('bg');
[['Vacío', 'none'], ['Skybox', 'sky']].forEach(([label, mode], i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = label;
  b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => {
    [...bgEl.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    setBackground(mode);
  };
  bgEl.appendChild(b);
});

setLighting('space');
select(CATALOG[0], catalogEl.children[0]);
</script>
</body>
</html>
